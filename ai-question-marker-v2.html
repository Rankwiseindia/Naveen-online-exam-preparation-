<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI सवाल जनरेटर v2 - Groq</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f4f8; color:#333; padding:20px; max-width:900px; margin:auto; }
    h1 { color:#007bff; text-align:center; }
    input, button, select { padding:12px; font-size:16px; margin:10px 0; width:100%; border-radius:6px; border:1px solid #ccc; }
    button { background:#28a745; color:white; border:none; cursor:pointer; }
    button:hover { background:#218838; }
    #output { background:white; padding:20px; border-radius:10px; margin-top:20px; min-height:200px; border:1px solid #ddd; white-space:pre-wrap; word-wrap:break-word; }
    .error { color:red; font-weight:bold; }
    .success { color:green; font-weight:bold; }
    pre { background:#f8f9fa; padding:10px; border-radius:6px; overflow:auto; }
  </style>
</head>
<body>

  <h1>Groq AI से 10 MCQ सवाल बनाओ (v2)</h1>

  <div>
    <label>1. Groq API Key डालो:</label><br>
    <input type="text" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
  </div>

  <div>
    <label>2. टॉपिक लिखो:</label><br>
    <input type="text" id="topic" value="SSC CGL General Knowledge" placeholder="उदा. SSC CGL Reasoning">
  </div>

  <div>
    <label>3. मॉडल चुनो (अगर एक नहीं चले तो दूसरा ट्राई करो):</label><br>
    <select id="model">
      <option value="llama-3.1-70b-versatile">llama-3.1-70b-versatile (बेस्ट JSON)</option>
      <option value="mixtral-8x7b-32768">mixtral-8x7b-32768 (तेज)</option>
      <option value="llama3-70b-8192">llama3-70b-8192 (पुराना लेकिन अच्छा)</option>
    </select>
  </div>

  <button onclick="generateQuestions()">सवाल जनरेट करो</button>

  <div id="output">
    <p>यहाँ AI से बने सवाल दिखेंगे...</p>
  </div>

  <script>
    async function generateQuestions() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const topic = document.getElementById('topic').value.trim() || "SSC CGL GK";
      const model = document.getElementById('model').value;

      if (!apiKey || !apiKey.startsWith('gsk_')) {
        alert("सही Groq API Key डालो (gsk_ से शुरू)");
        return;
      }

      const output = document.getElementById('output');
      output.innerHTML = `<p class="success">AI से सवाल बन रहे हैं... (मॉडल: ${model})</p>`;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              {
                role: "system",
                content: `तुम एक MCQ जनरेटर हो। जवाब **केवल** और **केवल** VALID JSON में दो। 
                कोई भी एक्स्ट्रा टेक्स्ट, मार्कडाउन, व्याख्या, "यहाँ है" या कोई शब्द मत लिखना। 
                आउटपुट बिल्कुल ये होना चाहिए:
                {"questions":[
                  {"question":"सवाल हिंदी में?","options":["A. विकल्प1","B. विकल्प2","C. विकल्प3","D. विकल्प4"],"correct":0},
                  ...
                ]}
                correct: 0 = A, 1 = B, 2 = C, 3 = D
                ठीक 10 सवाल बनाओ। SSC/Bank लेवल। हिंदी में।`
              },
              {
                role: "user",
                content: `टॉपिक: ${topic}. ठीक 10 MCQ बनाओ।`
              }
            ],
            temperature: 0.3,
            max_tokens: 3000
          })
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(`API एरर ${response.status}: ${err}`);
        }

        const data = await response.json();
        const rawText = data.choices[0].message.content.trim();

        let questions = [];
        try {
          const parsed = JSON.parse(rawText);
          questions = parsed.questions || [];
        } catch (parseError) {
          output.innerHTML = `
            <p class="error">JSON पार्स नहीं हुआ (AI ने गलत फॉर्मेट दिया)</p>
            <p>रॉ रिस्पॉन्स (कॉपी करके देखो):</p>
            <pre>${rawText}</pre>
            <p>अगर JSON जैसा दिख रहा है तो मैन्युअली कॉपी करके questions.js में ऐड कर लो।</p>
          `;
          return;
        }

        if (questions.length === 0) {
          output.innerHTML = "<p class='error'>कोई सवाल नहीं मिला। टॉपिक या मॉडल बदलकर ट्राई करो।</p>";
          return;
        }

        let html = `<p class="success">AI ने ${questions.length} सवाल बनाए!</p>`;
        questions.forEach((q, i) => {
          html += `<div class="question">
            <strong>सवाल ${i+1}:</strong> ${q.question}<br><br>
            <ol type="A">
              \( {q.options.map(opt => `<li> \){opt}</li>`).join('')}
            </ol>
            <strong>सही जवाब:</strong> ${String.fromCharCode(65 + q.correct)}
          </div>`;
        });

        output.innerHTML = html;

      } catch (error) {
        output.innerHTML = `<p class="error">एरर: ${error.message}</p>
          <p>कॉन्सोल में डिटेल देखो (F12 → Console)। Key चेक करो या Groq कंसोल पर जाओ।</p>`;
        console.error("Groq Error:", error);
      }
    }
  </script>

</body>
</html>
