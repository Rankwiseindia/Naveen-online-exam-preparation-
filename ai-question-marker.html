<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI सवाल जनरेटर - Groq</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f4f8; color:#333; padding:20px; max-width:900px; margin:auto; }
    h1 { color:#007bff; text-align:center; }
    input, button { padding:12px; font-size:16px; margin:10px 0; width:100%; border-radius:6px; border:1px solid #ccc; }
    button { background:#28a745; color:white; border:none; cursor:pointer; }
    button:hover { background:#218838; }
    #output { background:white; padding:20px; border-radius:10px; margin-top:20px; min-height:200px; border:1px solid #ddd; white-space:pre-wrap; }
    .question { margin:20px 0; padding:15px; background:#f8f9fa; border-left:5px solid #007bff; border-radius:6px; }
    .error { color:red; font-weight:bold; }
  </style>
</head>
<body>

  <h1>Groq AI से MCQ सवाल बनाओ</h1>

  <div>
    <label>Groq API Key डालो (gsk_ से शुरू):</label><br>
    <input type="text" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
  </div>

  <div>
    <label>टॉपिक लिखो (उदा. SSC CGL GK, Reasoning, Math):</label><br>
    <input type="text" id="topic" value="SSC CGL General Knowledge" placeholder="टॉपिक">
  </div>

  <button onclick="generateQuestions()">10 नए MCQ सवाल बनाओ</button>

  <div id="output">
    <p>यहाँ AI से बने सवाल दिखेंगे...</p>
  </div>

  <script>
    async function generateQuestions() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const topic = document.getElementById('topic').value.trim() || "SSC CGL GK";

      if (!apiKey || !apiKey.startsWith('gsk_')) {
        alert("सही Groq API Key डालो!");
        return;
      }

      const output = document.getElementById('output');
      output.innerHTML = "<p>AI से सवाल जनरेट हो रहे हैं... (10-40 सेकंड लग सकते हैं)</p>";

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "llama-3.1-70b-versatile",
            messages: [
              {
                role: "system",
                content: `तुम एक MCQ जनरेटर हो। जवाब सिर्फ VALID JSON में दो। कोई एक्स्ट्रा टेक्स्ट, मार्कडाउन या व्याख्या मत डालना।
                फॉर्मेट बिल्कुल ये होना चाहिए:
                {"questions": [
                  {"question": "सवाल हिंदी में?", "options": ["A. ऑप्शन 1", "B. ऑप्शन 2", "C. ऑप्शन 3", "D. ऑप्शन 4"], "correct": 0},
                  ...
                ]}
                correct: 0 = A, 1 = B, 2 = C, 3 = D
                ठीक 10 सवाल बनाओ, SSC/Bank लेवल के, हिंदी में।`
              },
              {
                role: "user",
                content: `टॉपिक: ${topic}. ठीक 10 MCQ बनाओ।`
              }
            ],
            temperature: 0.4,
            max_tokens: 2500
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API एरर: ${response.status} - ${errText}`);
        }

        const data = await response.json();
        let rawText = data.choices[0].message.content.trim();

        let questions = [];
        try {
          const parsed = JSON.parse(rawText);
          questions = parsed.questions || [];
        } catch (parseErr) {
          output.innerHTML = `<p class="error">JSON पार्स फेल: ${rawText}</p>`;
          console.log("Raw Response:", rawText);
          return;
        }

        if (questions.length === 0) {
          output.innerHTML = "<p class='error'>कोई सवाल नहीं मिला। टॉपिक बदलकर ट्राई करो।</p>";
          return;
        }

        let html = `<h3>AI ने \( {questions.length} सवाल बनाए ( \){topic}):</h3>`;
        questions.forEach((q, i) => {
          html += `<div class="question">
            <strong>सवाल ${i+1}:</strong> ${q.question}<br><br>
            <ol type="A">
              \( {q.options.map(opt => `<li> \){opt}</li>`).join('')}
            </ol>
            <strong>सही जवाब:</strong> ${String.fromCharCode(65 + q.correct)}
          </div>`;
        });

        output.innerHTML = html;

      } catch (error) {
        output.innerHTML = `<p class="error">एरर: ${error.message}<br>Console में देखो (F12)। Key चेक करो या Groq कंसोल में देखो।</p>`;
        console.error("Groq Error:", error);
      }
    }
  </script>

</body>
</html>
